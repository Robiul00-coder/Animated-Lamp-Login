<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animated Lamp Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!-- Lamp Section -->
        <div class="lamp-wrapper">
            <svg class="lamp-svg" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg" role="img"
                aria-label="Animated lamp">
                <!-- Inner Glow -->
                <ellipse class="inner-glow" cx="100" cy="110" rx="60" ry="30" />
                <!-- Lamp Stand -->
                <rect class="lamp-base" x="92" y="100" width="16" height="160" rx="8" />
                <!-- Lamp Base -->
                <rect class="lamp-base" x="60" y="250" width="80" height="12" rx="6" />
                <!-- Pull Cord -->
                <g class="pull-cord" id="pullCord" role="button" tabindex="0"
                    aria-label="Turn on lamp and show login form">
                    <line class="cord-line" x1="130" y1="110" x2="130" y2="180" />
                    <circle class="cord-bead" cx="130" cy="190" r="6" />
                    <circle class="cord-hit" cx="130" cy="190" r="25" fill="transparent" />
                </g>

                <!-- Lamp Shade -->
                <path class="lamp-shade" d="M30 110
                       C30 50, 170 50, 170 110
                       C170 125, 30 125, 30 110 Z" />
            </svg>
            <p class="lamp-text">
                Click the lamp 💡
            </p>
        </div>

        <!-- Authentication Wrapper -->
        <div class="auth-wrapper" id="authWrapper">
            <!-- Login Form -->
            <div class="auth-box" id="loginForm">
                <h1>Welcome Back!</h1>
                <p>Login to continue your adventure 🚀</p>
                <form id="loginFormElement">
                    <div class="input-group">
                        <label for="loginEmail">
                            Email Address
                        </label>
                        <input type="email" id="loginEmail" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <label for="loginPassword">
                            Password
                        </label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    </div>
                    <div class="form-options">
                        <label class="remember">
                            <input type="checkbox">
                            Remember me
                        </label>
                        <a href="#">
                            Forgot Password?
                        </a>
                    </div>
                    <button type="submit">
                        Login
                    </button>
                </form>
                <p class="switch-text">
                    Don't have an account?
                    <a href="#" id="showSignup">
                        Sign Up
                    </a>
                </p>
            </div>

            <!-- Signup Form -->
            <div class="auth-box hidden" id="signupForm">
                <h1>Create Account!</h1>
                <p>Join us and start your journey ✨</p>
                <form id="signupFormElement">
                    <div class="input-group">
                        <label for="signupName">
                            Full Name
                        </label>
                        <input type="text" id="signupName" placeholder="Enter your full name" required>
                    </div>
                    <div class="input-group">
                        <label for="signupEmail">
                            Email Address
                        </label>
                        <input type="email" id="signupEmail" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <label for="signupPassword">
                            Password
                        </label>
                        <input type="password" id="signupPassword" placeholder="Create a password" required>
                    </div>
                    <button type="submit">Sign Up</button>
                </form>
                <p class="switch-text">
                    Already have an account?
                    <a href="#" id="showLogin">
                        Login
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script src="main.js"></script>

</body>

</html>
